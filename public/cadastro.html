<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | LogWeek</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel">
      <p class="eyebrow">Nova conta</p>
      <h1>Crie seu acesso.</h1>
      <p class="muted">Crie uma conta para organizar seus apontamentos semanais.</p>

      <form id="formCadastro" class="formulario" onsubmit="cadastrar(this); return false;">
        <label>
          Nome
          <input id="nome" name="nome" type="text" autocomplete="name" maxlength="100" required>
        </label>

        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </label>

        <label>
          Senha
          <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>

        <button class="primary-button" type="submit">Cadastrar</button>
      </form>

      <p id="mensagem" class="message"></p>

      <p class="auth-link">
        Já tem conta?
        <a href="login.html">Entrar</a>
      </p>
    </section>
  </main>

  <script src="js/usuarios.js"></script>
</body>
</html>
